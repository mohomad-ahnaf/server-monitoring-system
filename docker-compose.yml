version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:14-alpine
    container_name: monitoring-db
    environment:
      POSTGRES_DB: ${DB_NAME:-monitoring_db}
      POSTGRES_USER: ${DB_USER:-monitoring_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password123}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-monitoring_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - monitoring-network
    restart: unless-stopped
    labels:
      description: "PostgreSQL database for monitoring system"

  # Flask Dashboard & Monitoring Application
  app:
    build:
      context: .
      dockerfile: ./docker/Dockerfile
    container_name: monitoring-app
    environment:
      DB_TYPE: postgresql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-monitoring_user}
      DB_PASSWORD: ${DB_PASSWORD:-password123}
      DB_NAME: ${DB_NAME:-monitoring_db}
      FLASK_ENV: ${FLASK_ENV:-production}
      FLASK_DEBUG: ${FLASK_DEBUG:-False}
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-change-in-production}
      FLASK_HOST: 0.0.0.0
      FLASK_PORT: 5000
      MONITORING_INTERVAL: ${MONITORING_INTERVAL:-60}
      CPU_THRESHOLD: ${CPU_THRESHOLD:-80}
      MEMORY_THRESHOLD: ${MEMORY_THRESHOLD:-85}
      DISK_THRESHOLD: ${DISK_THRESHOLD:-90}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "5000:5000"
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
      - ./backups:/app/backups
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/stats"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - monitoring-network
    restart: unless-stopped
    labels:
      description: "Flask monitoring dashboard and collector"

  # Optional: PgAdmin for database management
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: monitoring-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@monitoring.local
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - monitoring-network
    restart: unless-stopped
    profiles:
      - debug
    labels:
      description: "PgAdmin web interface for database management"

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  monitoring-network:
    driver: bridge
    name: monitoring-network
